# 推送到 main 和 PR 时的检查，与 GitLab CI 同一套：生成物一致、Go 编译/vet/gofmt/测试、合同与译文检查、前端类型检查与构建。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go 编译、测试与合同检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: 生成物与仓库一致
        run: |
          make gen
          make docs
          # oapi-codegen 把接口规格 gzip 后以 base64 内嵌，压缩字节随 Go 版本不同；只忽略这些行，其余差异都算不一致。
          drift="$(git diff -U0 | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' | grep -vE '^[+-]\s*"[A-Za-z0-9+/=]+",$' || true)"
          if test -n "$drift"; then git diff --stat; echo "$drift" | head -50; exit 1; fi
      - name: 编译、vet、gofmt
        run: make build
      - name: 测试
        run: |
          for m in libs/platform modules/*; do
            if test -f "$m/go.mod"; then (cd "$m" && GOFLAGS=-mod=readonly go test -p 2 ./...) || exit 1; fi
          done
      - name: 合同、链接、隐私与译文检查
        # 检查脚本会核对提交身份；与 GitLab CI 一样取当前提交的作者，不改仓库配置。
        run: |
          author_name="$(git show -s --format=%an HEAD)"
          author_email="$(git show -s --format=%ae HEAD)"
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=user.name GIT_CONFIG_KEY_1=user.email
          export GIT_CONFIG_VALUE_0="$author_name" GIT_CONFIG_VALUE_1="$author_email"
          make check

  web:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  rust:
    name: Rust 服务检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: 编译检查
        working-directory: rust
        run: cargo check --locked --workspace
