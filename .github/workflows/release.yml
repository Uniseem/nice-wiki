# 推送 v* 标签时在 GitHub 发版：交叉编译全部服务、用 crane 组装并推送 amd64/arm64 镜像到 ghcr.io、
# 打“下载即部署”的发布包，再发布到 GitHub Releases（步骤见 scripts/release.sh）。用 Actions 自带的令牌，不需要另配密钥。
# 已有标签补发：在 Actions 页手动运行并填标签。发布说明取自附注标签的正文。GitLab 只同步代码，不在那边发版。
name: 发版

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的已有标签，如 v0.1.3
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  # Rust 的检索与入口服务：各架构在原生机器上编成 musl 静态程序（与 alpine 基础镜像一致），交给下面的发版任务装进镜像。
  rust:
    name: 编译 Rust 服务（${{ matrix.arch }}）
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: 编译
        working-directory: rust
        run: cargo build --release --locked --target ${{ matrix.target }} -p nw-search -p nw-edge
      - run: |
          mkdir rust-out
          cp rust/target/${{ matrix.target }}/release/nw-search rust/target/${{ matrix.target }}/release/nw-edge rust-out/
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.arch }}
          path: rust-out/*
          if-no-files-found: error

  release:
    name: 构建并发布
    needs: rust
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      # checkout 会把附注标签换成轻量标签，发布说明就读不到了；先取回原附注标签。
      - run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      # 前端构建、Go 交叉编译和安装 crane 互不依赖，同时进行。
      - name: 前端产物、编译全部服务、安装 crane
        run: |
          pnpm install --frozen-lockfile
          pnpm build >"$RUNNER_TEMP/web.log" 2>&1 & web=$!
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.6 & crane=$!
          scripts/release.sh build "$TAG"
          wait "$crane"
          wait "$web" || { cat "$RUNNER_TEMP/web.log"; exit 1; }
          cat "$RUNNER_TEMP/web.log"
          test -f web-dist/index.html
      - uses: actions/download-artifact@v5
        with:
          name: rust-amd64
          path: release/linux-amd64
      - uses: actions/download-artifact@v5
        with:
          name: rust-arm64
          path: release/linux-arm64
      - run: chmod +x release/linux-*/nw-search release/linux-*/nw-edge
      - name: 登录 ghcr.io
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          printf '%s' "$GITHUB_TOKEN" | "$(go env GOPATH)/bin/crane" auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: scripts/release.sh images "$TAG"
      - run: scripts/release.sh package "$TAG"
      - run: scripts/release.sh publish "$TAG"
