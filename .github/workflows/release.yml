# 推送 v* 标签时在 GitHub 正式发版：构建 linux amd64/arm64 的全部服务二进制与前端产物，
# 把 15 个服务的镜像推到 ghcr.io，再打包“下载即部署”的发布包（部署文件 + 二进制 + 前端产物）附校验和。
# 发布说明取自附注标签的正文。GitLab 只同步代码，不在那边发版。
name: 发版

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  web:
    name: 前端产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: NW_WEB_OUT="$PWD/web-dist" pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web-dist/

  binaries:
    name: 服务二进制（${{ matrix.arch }}）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: "**/go.sum"
      - name: 编译
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          out="$PWD/bin"
          mkdir -p "$out"
          for cmd in modules/*/cmd/*; do
            module="${cmd%/cmd/*}"
            name="${cmd##*/}"
            (cd "$module" && go build -trimpath -ldflags "-s -w" -o "$out/$name" "./cmd/$name") || exit 1
          done
          (cd libs/platform && go build -trimpath -ldflags "-s -w" -o "$out/nw-keys" ./cmd/nw-keys)
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: bin/

  images:
    name: 发布镜像
    needs: [web, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # 各服务的 Dockerfile.release 直接打包这里的二进制和前端产物，镜像里不再编译。
      - name: 准备镜像材料
        run: |
          mkdir -p release
          mv artifacts/bin-amd64 release/linux-amd64
          mv artifacts/bin-arm64 release/linux-arm64
          mv artifacts/web release/web
          chmod +x release/linux-*/*
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 构建并推送
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          for file in modules/*/Dockerfile.release; do
            slug=$(basename "$(dirname "$file")")
            image="ghcr.io/$owner/nice-wiki-$slug"
            docker buildx build --platform linux/amd64,linux/arm64 -f "$file" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.description=nice-wiki $slug" \
              --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
              -t "$image:$GITHUB_REF_NAME" -t "$image:latest" --push . || exit 1
          done

  release:
    name: 创建 GitHub Release
    needs: [web, binaries, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # 发布包解压即可部署：deploy/ 里是拉取上面镜像的编排、配置、Caddy 与脚本，bin/ 自带 nw-keys，服务器上不需要 Go。
      - name: 打包
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          for arch in amd64 arm64; do
            name="nice-wiki-${tag}-linux-${arch}"
            root="pkg/$name"
            mkdir -p "$root/config" "$root/deploy"
            cp -R "artifacts/bin-${arch}" "$root/bin"
            chmod +x "$root/bin/"*
            cp -R artifacts/web "$root/web"
            cp modules/portal/config/routes.json "$root/config/routes.json"
            cp -R deploy/config deploy/caddy "$root/deploy/"
            cp deploy/init-secrets.sh deploy/backup.sh deploy/restore.sh deploy/restore-archive.sh "$root/deploy/"
            cp deploy/release/docker-compose.yml "$root/deploy/docker-compose.yml"
            sed "s/^NW_VERSION=.*/NW_VERSION=${tag}/" deploy/.env.example > "$root/deploy/.env.example"
            cp deploy/release/README.md "$root/README.md"
            cp LICENSE "$root/"
            tar -C pkg -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        # checkout 会把附注标签换成轻量标签，--notes-from-tag 就会退回读提交说明；先取回原附注标签。
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/* --title "nice-wiki $GITHUB_REF_NAME" --notes-from-tag --verify-tag
