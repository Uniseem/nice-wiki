version: "2"
linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        foundation:
          files:
            - "**/internal/fsutil/*.go"
            - "**/internal/textutil/*.go"
            - "**/internal/doc/**/*.go"
          deny:
            - pkg: nice-wiki/internal/app
              desc: 基础层不能导入组装层
            - pkg: nice-wiki/internal/store
              desc: 基础层不能导入数据库
            - pkg: nice-wiki/internal/api
              desc: 基础层不能导入接口层
