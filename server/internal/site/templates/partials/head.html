{{define "head"}}<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · {{.Site.Name}}</title>
{{if .Description}}<meta name="description" content="{{.Description}}">{{end}}
{{if .Canonical}}<link rel="canonical" href="{{.Canonical}}"><meta property="og:url" content="{{.Canonical}}">{{end}}
<meta property="og:title" content="{{.Title}}"><meta property="og:description" content="{{.Description}}">
{{range .Alternates}}<link rel="alternate" hreflang="{{.Language}}" href="{{.URL}}">{{end}}
{{if .Breadcrumb}}<script type="application/ld+json">{{.Breadcrumb}}</script>{{end}}
{{range .CSS}}<link rel="stylesheet" href="{{.}}">{{end}}
{{if .Dev}}<script type="module" src="http://localhost:5173/@vite/client"></script>{{end}}
</head>{{end}}
