{{define "doc"}}{{template "start" .}}
<article><h1 class="mb-6 text-4xl font-semibold">{{.Title}}</h1>
<div class="mb-8 flex flex-wrap gap-4 text-xs text-muted"><button type="button" data-copy-markdown>复制为 Markdown</button>{{if .MarkdownURL}}<a href="{{.MarkdownURL}}">Markdown 版本</a>{{end}}</div>
<textarea hidden data-markdown-source>{{.Markdown}}</textarea>
<div class="nw-content">{{.Body}}</div></article>
{{template "end" .}}{{end}}
