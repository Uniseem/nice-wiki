[package]
name = "nw-search"
version = "0.1.0"
edition = "2021"
description = "nice-wiki 检索服务（knowledge）：发布正文分块、背景短句、嵌入入库，全文（tantivy）+ 向量（pgvector）检索，文档卡片与全站概括"
license = "AGPL-3.0-only"

[dependencies]
nw-platform = { path = "../platform", features = ["db"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tantivy = { version = "0.22", default-features = false, features = ["mmap"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
percent-encoding = "2"
unicode-normalization = "0.1"
pdf-extract = "0.12"
time = { version = "0.3", features = ["formatting", "parsing"] }
