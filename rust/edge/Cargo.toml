[package]
name = "nw-edge"
version = "0.1.0"
edition = "2021"
description = "nice-wiki 唯一入口：按域名定位站点、会话与权限预检、按路由表转发、缓存、限流、流式透传"
license = "AGPL-3.0-only"

[dependencies]
nw-platform = { path = "../platform" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "io-util", "fs"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ed25519-dalek = "2"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
getrandom = "0.2"
percent-encoding = "2"
form_urlencoded = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
maxminddb = "0.24"
