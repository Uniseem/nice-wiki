# 单机部署编排（发布包）：拉取 ghcr.io 上的发布镜像。由 scripts/gen_deploy.py 生成，勿手改。
name: nice-wiki

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.231.97.0/24

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nicewiki
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-superuser-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./secrets/postgres/superuser-password:/run/secrets/pg-superuser-password:ro
      - ./secrets/postgres/roles.sql:/run/secrets/pg-roles.sql:ro
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nicewiki"]
      interval: 5s
      timeout: 3s
      retries: 20

  account:
    image: ${NW_IMAGES:-ghcr.io/uniseem/nice-wiki}-account:${NW_VERSION:?请在 deploy/.env 里设置 NW_VERSION}
    restart: unless-stopped
    networks: [internal]
    user: "0:0"
    environment:
      GOMEMLIMIT: ${GOMEMLIMIT:-256MiB}
      NW_ALLOW_LOCAL_HTTP: "false"
      NW_PUBLIC_BASE_URL: https://${SITE_DOMAIN}
      NW_EDGE_PURGE_URL: http://edge:8090
      NW_EDGE_PURGE_SECRET_FILE: /run/secrets/edge-purge-secret
      NW_CADDY_ADMIN_URL: http://caddy:2019
    volumes:
      - ./config/site-config.json:/config/site-config.json:ro
      - ./config/identity.json:/config/identity.json:ro
      - ./config/portal.json:/config/portal.json:ro
      - ./secrets/site-config:/run/secrets/site-config:ro
      - ./secrets/identity:/run/secrets/identity:ro
      - ./secrets/portal:/run/secrets/portal:ro
      - ./config/trust-anchors.json:/run/secrets/trust-anchors.json:ro
      - account-data:/data
      - ./secrets/master-key:/run/secrets/master-key:ro
      - ./secrets/budget:/run/secrets/budget:ro
      - ./secrets/edge/purge-secret:/run/secrets/edge-purge-secret:ro
    depends_on:
      postgres: {condition: service_healthy}

  content:
    image: ${NW_IMAGES:-ghcr.io/uniseem/nice-wiki}-content:${NW_VERSION:?请在 deploy/.env 里设置 NW_VERSION}
    restart: unless-stopped
    networks: [internal]
    user: "0:0"
    environment:
      GOMEMLIMIT: ${GOMEMLIMIT:-256MiB}
      NW_ALLOW_LOCAL_HTTP: "false"
      NW_PUBLIC_BASE_URL: https://${SITE_DOMAIN}
    volumes:
      - ./config/content.json:/config/content.json:ro
      - ./config/media.json:/config/media.json:ro
      - ./config/localization.json:/config/localization.json:ro
      - ./config/public-site.json:/config/public-site.json:ro
      - ./secrets/content:/run/secrets/content:ro
      - ./secrets/media:/run/secrets/media:ro
      - ./secrets/localization:/run/secrets/localization:ro
      - ./secrets/public-site:/run/secrets/public-site:ro
      - ./config/trust-anchors.json:/run/secrets/trust-anchors.json:ro
      - content-data:/data
      - ./secrets/master-key:/run/secrets/master-key:ro
    depends_on:
      postgres: {condition: service_healthy}

  ai:
    image: ${NW_IMAGES:-ghcr.io/uniseem/nice-wiki}-ai:${NW_VERSION:?请在 deploy/.env 里设置 NW_VERSION}
    restart: unless-stopped
    networks: [internal]
    user: "0:0"
    environment:
      GOMEMLIMIT: ${GOMEMLIMIT:-256MiB}
    volumes:
      - ./config/model-gateway.json:/config/model-gateway.json:ro
      - ./config/qa.json:/config/qa.json:ro
      - ./config/agent.json:/config/agent.json:ro
      - ./config/memory.json:/config/memory.json:ro
      - ./config/knowledge.json:/config/knowledge.json:ro
      - ./secrets/model-gateway:/run/secrets/model-gateway:ro
      - ./secrets/qa:/run/secrets/qa:ro
      - ./secrets/agent:/run/secrets/agent:ro
      - ./secrets/memory:/run/secrets/memory:ro
      - ./secrets/knowledge:/run/secrets/knowledge:ro
      - ./config/trust-anchors.json:/run/secrets/trust-anchors.json:ro
      - ai-data:/data
      - ./secrets/master-key:/run/secrets/master-key:ro
      - ./secrets/search/secret:/run/secrets/search-secret:ro
    depends_on:
      postgres: {condition: service_healthy}

  ops:
    image: ${NW_IMAGES:-ghcr.io/uniseem/nice-wiki}-ops:${NW_VERSION:?请在 deploy/.env 里设置 NW_VERSION}
    restart: unless-stopped
    networks: [internal]
    user: "0:0"
    environment:
      GOMEMLIMIT: ${GOMEMLIMIT:-256MiB}
    volumes:
      - ./config/jobs.json:/config/jobs.json:ro
      - ./config/analytics.json:/config/analytics.json:ro
      - ./config/traffic-guard.json:/config/traffic-guard.json:ro
      - ./secrets/jobs:/run/secrets/jobs:ro
      - ./secrets/analytics:/run/secrets/analytics:ro
      - ./secrets/traffic-guard:/run/secrets/traffic-guard:ro
      - ./config/trust-anchors.json:/run/secrets/trust-anchors.json:ro
      - ops-data:/data
      - ./secrets/budget:/run/secrets/budget:ro
    depends_on:
      postgres: {condition: service_healthy}

  search:
    image: ${NW_IMAGES:-ghcr.io/uniseem/nice-wiki}-search:${NW_VERSION:?请在 deploy/.env 里设置 NW_VERSION}
    restart: unless-stopped
    networks: [internal]
    volumes:
      - ./config/search.json:/config/search.json:ro
      - ./secrets/search/secret:/run/secrets/search-secret:ro
      - ./secrets/search/database-url:/run/secrets/database-url:ro
      - search-data:/data
    depends_on:
      postgres: {condition: service_healthy}

  edge:
    image: ${NW_IMAGES:-ghcr.io/uniseem/nice-wiki}-edge:${NW_VERSION:?请在 deploy/.env 里设置 NW_VERSION}
    restart: unless-stopped
    networks: [internal]
    volumes:
      - ./config/edge.json:/config/edge.json:ro
      - ./secrets/edge/purge-secret:/run/secrets/purge-secret:ro
      - edge-cache:/cache
    depends_on: [account]

  caddy:
    build: ./caddy
    image: nice-wiki/caddy:${NW_VERSION:-dev}
    restart: unless-stopped
    networks: [internal]
    ports: ["${NW_BIND:-0.0.0.0}:80:80", "${NW_BIND:-0.0.0.0}:443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/conf.d:/etc/caddy/conf.d:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [edge]

volumes:
  postgres-data:
  account-data:
  content-data:
  ai-data:
  ops-data:
  search-data:
  edge-cache:
  caddy-data:
  caddy-config:
