services:
  nice-wiki:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - nice-wiki-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/nice-wiki", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nice-wiki-data:
