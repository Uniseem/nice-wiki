    restart: unless-stopped
    networks: [internal]
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [portal]

volumes:
  portal-data:
  public-site-data:
  identity-data:
  site-config-data:
  content-data:
  media-data:
  model-gateway-data:
  knowledge-data:
  qa-data:
  localization-data:
  memory-data:
  traffic-guard-data:
  jobs-data:
  analytics-data:
  data-protection-data:
  backups:
  caddy-data:
  caddy-config:
