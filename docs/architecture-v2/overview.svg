<g class="c-gray">
<rect x="200" y="120" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="138" text-anchor="middle" dominant-baseline="central">Caddy</text>
<text class="ts" x="340" y="156" text-anchor="middle" dominant-baseline="central">TLS：平台域名、站点通配、自定义域名</text>
</g>
<line x1="340" y1="178" x2="340" y2="204" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral">
<rect x="40" y="210" width="600" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="228" text-anchor="middle" dominant-baseline="central">edge</text>
