<text class="ts" x="216" y="376" text-anchor="middle" dominant-baseline="central">Go</text>
<text class="ts" x="216" y="402" text-anchor="middle" dominant-baseline="central">文档与发布</text>
<text class="ts" x="216" y="420" text-anchor="middle" dominant-baseline="central">媒体与存储</text>
