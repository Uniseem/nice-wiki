<svg xmlns="http://www.w3.org/2000/svg" width="680" height="710" viewBox="0 0 680 710" role="img">
<title>新架构总览：模块与功能</title>
<desc>浏览器经 Caddy 进入 Rust 编写的 edge，edge 把请求转发到 account、content、ai、search、ops 五个服务；五个服务共用一个 PostgreSQL，正文、媒体和全文索引文件放在文件存储。</desc>
<style>
text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#FFFFFF;stroke:#888780}
.arr{stroke:#73726C;stroke-width:1.2;fill:none}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}
.c-coral>.ts{fill:#993C1D}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray>.th{fill:#444441}
.c-gray>.ts{fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="710" fill="#FFFFFF"/>
<rect class="c-coral" x="40" y="34" width="12" height="12" rx="2" stroke-width="0.5"/>
<text class="ts" x="60" y="40" dominant-baseline="central">Rust</text>
<rect class="c-teal" x="40" y="54" width="12" height="12" rx="2" stroke-width="0.5"/>
<text class="ts" x="60" y="60" dominant-baseline="central">Go</text>
<rect class="c-gray" x="40" y="74" width="12" height="12" rx="2" stroke-width="0.5"/>
<text class="ts" x="60" y="80" dominant-baseline="central">基础设施</text>
<rect class="box" x="240" y="30" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">浏览器</text>
<text class="ts" x="340" y="66" text-anchor="middle" dominant-baseline="central">访客、用户、站主</text>
