stages:
  - generate
  - build

default:
  image: golang:1.25.5-bookworm
  tags:
    - linux
    - docker
    - hostdzire
  interruptible: true
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends python3
    - ci_author_name="$(git show -s --format=%an HEAD)"
    - ci_author_email="$(git show -s --format=%ae HEAD)"
    - export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=user.name GIT_CONFIG_KEY_1=user.email
    - export GIT_CONFIG_VALUE_0="$ci_author_name" GIT_CONFIG_VALUE_1="$ci_author_email"

variables:
  GOMAXPROCS: "2"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  PNPM_HOME: "/usr/local/bin"

生成与格式:
  stage: generate
  cache:
    key: go1255-generate
    paths:
      - .cache/
  script:
    - apt-get install -y --no-install-recommends curl xz-utils
    - |
      mkdir -p .cache/node22
      cd .cache/node22
      curl -fsSLO https://nodejs.org/dist/v22.20.0/node-v22.20.0-linux-x64.tar.xz
      curl -fsSLO https://nodejs.org/dist/v22.20.0/SHASUMS256.txt
      sha256sum --check --ignore-missing SHASUMS256.txt
      tar -xJf node-v22.20.0-linux-x64.tar.xz -C /usr/local --strip-components=1
      cd "$CI_PROJECT_DIR"
    - npm install --global pnpm@9.15.9
    - go version
    - |
      for m in libs/platform modules/*; do
        if test -f "$m/go.mod"; then (cd "$m" && go mod tidy) || exit 1; fi
      done
    - |
      for frontend_dir in modules/*/ui modules/*/web; do
        if test -f "$frontend_dir/package.json"; then
          pnpm --dir "$frontend_dir" install --lockfile-only --ignore-scripts || exit 1
          git add -N "$frontend_dir/pnpm-lock.yaml"
        fi
      done
    - git ls-files -z '*.go' | xargs -0 gofmt -w
    - make docs
    - make gen
    - git diff --binary > generated.patch
    - make docs
    - make gen
    - git diff --binary > regenerated.patch
    - cmp generated.patch regenerated.patch
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - generated.patch

编译与检查:
  stage: build
  needs:
    - job: 生成与格式
      artifacts: true
  parallel:
    matrix:
      - BUILD_GROUP: foundation
        BUILD_MODULES: libs/platform modules/identity modules/site-config modules/jobs modules/portal
        CHECK_DOCS: "1"
      - BUILD_GROUP: content-media
        BUILD_MODULES: modules/content modules/media modules/traffic-guard modules/analytics modules/data-protection
        CHECK_DOCS: "0"
      - BUILD_GROUP: ai
        BUILD_MODULES: modules/model-gateway modules/knowledge modules/memory modules/localization modules/qa modules/public-site
        CHECK_DOCS: "0"
  cache:
    key: go1255-$BUILD_GROUP
    when: always
    paths:
      - .cache/
  script:
    - if test -s generated.patch; then git apply generated.patch; fi
    - git diff --check
    - make build GO_MODULES="$BUILD_MODULES"
    - for m in $BUILD_MODULES; do (cd "$m" && GOFLAGS=-mod=readonly go test -p 2 ./...) || exit 1; done
    - if test "$CHECK_DOCS" = 1; then make check; fi

前端构建与类型检查:
  stage: build
  image: node:22.20.0-bookworm
  needs:
    - job: 生成与格式
      artifacts: true
  cache:
    key: node22-module-frontends
    paths:
      - .cache/npm/
      - .cache/pnpm-store/
  script:
    - if test -s generated.patch; then git apply generated.patch; fi
    - npm install --global pnpm@9.15.9
    - |
      for frontend_dir in modules/*/ui modules/*/web; do
        if test -f "$frontend_dir/package.json"; then
          pnpm --dir "$frontend_dir" install --frozen-lockfile --store-dir "$CI_PROJECT_DIR/.cache/pnpm-store" || exit 1
          pnpm --dir "$frontend_dir" typecheck || exit 1
          pnpm --dir "$frontend_dir" build || exit 1
        fi
      done
