<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nice Wiki 本地化</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mountModuleUI } from "/src/main.ts";

      mountModuleUI(document.querySelector("#app"), {
        module: "localization",
        apiBaseURL: "/api",
        locale: document.documentElement.lang || "zh-CN",
        mountSelector: "#app",
        capabilities: [],
        buildRevision: "dev",
      });
    </script>
  </body>
</html>
